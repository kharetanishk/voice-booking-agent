# Reverse proxy for the voice agent. TLS lines are added by `certbot --nginx -d <domain> --redirect`.
server {
    listen 80;
    server_name voice-agent.example.com;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;

        # The call runs over one WebSocket: audio up, audio and events down.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx closes idle proxied connections after 60 s by default, which would drop a call on hold.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
